[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tk.r.openmined"
version = "0.1.0"
description = "model ensembles"
readme = "README.md"
requires-python = ">=3.12,<3.15"  # pin for google deps google-re2
dependencies = [
    "matplotlib",
    # runtime to locally run the eval server
    "screamingface[notebook,runtime,inspect]>=0.1.2",
    "routellm",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupytext",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tk"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["src"]
python_files = ["*.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

# NOTE(2026-10):
# screamface hardcodes `version = "0.1.2"` in git main and only stamps release versions
# (e.g. 0.1.6+) dynamically in PyPI CI workflows. `sf.__version__` reports 0.1.2
# even though this pulls the latest commit from GitHub main.
[tool.uv.sources]
screamingface = { git = "https://github.com/ScreamingFace/screamingface", subdirectory = "packages/screamingface" }

[tool.uv]
# NOTE(tk) hack
# Why this works: In practice, inspect-ai rarely breaks on minor/patch bumps of boto3, so forcing boto3 to satisfy LiteLLM almost always runs fine at runtime.
override-dependencies = [
    # option 1: pin to matching version
    # "boto3<=1.42.99",
    # "botocore<=1.42.99",

    # option 2 (more haxxor): point aioboto3 to a dummy/empty package
    "aioboto3; extra == 'nonexistent_extra_never_used'",
]
